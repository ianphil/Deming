[project]
name = "deming-workflows"
version = "0.1.0"
description = "Local Prefect workflows executing Deming through headless Pi"
requires-python = ">=3.12,<3.13"
dependencies = ["prefect==3.8.7"]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "psutil>=7,<8"]

[tool.pytest.ini_options]
testpaths = ["tests/workflows"]
pythonpath = ["."]
