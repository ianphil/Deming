name: deming-workflows
services:
  prefect:
    image: prefecthq/prefect:3.8.7-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      PREFECT_HOME: /data
      PREFECT_SERVER_UI_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
volumes:
  prefect-data:
